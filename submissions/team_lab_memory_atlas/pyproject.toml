[project]
name = "team-lab-memory-atlas"
version = "0.1.0"
description = "Interactive people/project map for De Ridder Lab meeting memory."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "ollama>=0.6.0",
    "litellm>=1.50.0",
    "pytest>=8.0.0",
    "pillow>=12.0.0",
    "python-pptx>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_memory_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
